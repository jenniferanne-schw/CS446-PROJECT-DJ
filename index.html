<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Price Drop Tracker</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; max-width: 820px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    .sub { color: #94a3b8; margin-bottom: 24px; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    input, button { padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; font-size: 14px; }
    input { background: #0f172a; color: #f8fafc; flex: 1; min-width: 140px; }
    button { background: #3b82f6; color: white; border: none; cursor: pointer; font-weight: 600; }
    button:hover { background: #2563eb; }
    button.check { background: #10b981; }
    button.check:hover { background: #059669; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #334155; }
    .badge { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .deal { background: #065f46; color: #6ee7b7; }
    .wait { background: #334155; color: #cbd5e1; }
    #status { margin-top: 12px; font-size: 14px; color: #38bdf8; }
  </style>
</head>
<body>
  <h1>Smart Price Drop Tracker</h1>
  <p class="sub">Powered by AWS Lambda, DynamoDB, S3 &amp; CloudWatch</p>

  <div class="card">
    <div class="row">
      <input id="coinId" placeholder="CoinGecko ID (e.g. ethereum, solana)" />
      <input id="coinName" placeholder="Display Name (e.g. Ethereum)" />
      <input id="targetPrice" type="number" step="any" placeholder="Target USD ($)" />
      <button onclick="addCoin()">+ Add to Watchlist</button>
      <button class="check" onclick="runCheck()">Run Live Price Check</button>
    </div>
    <div id="status">Loading watchlist...</div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>Asset</th><th>Current Price</th><th>Target Price</th><th>Status</th></tr>
      </thead>
      <tbody id="watchlist"></tbody>
    </table>
  </div>

  <script>
    const API_URL = "https://owvb6mtsi5viv7r3rsjps47fha0vrffh.lambda-url.us-east-1.on.aws/";

    function render(items) {
      const tbody = document.getElementById("watchlist");
      tbody.innerHTML = items.map(item => {
        const cur = Number(item.last_price || 0);
        const tgt = Number(item.target_price || 0);
        const isDeal = cur > 0 && cur <= tgt;
        return `<tr>
          <td><strong>${item.item_name || item.product_id}</strong></td>
          <td>$${cur.toLocaleString()}</td>
          <td>$${tgt.toLocaleString()}</td>
          <td><span class="badge ${isDeal ? 'deal' : 'wait'}">${isDeal ? 'PRICE DROP ALERT' : 'Monitoring'}</span></td>
        </tr>`;
      }).join("");
    }

    async function loadItems() {
      const res = await fetch(API_URL);
      const data = await res.json();
      render(data.items || []);
      document.getElementById("status").textContent = "Watchlist synced with DynamoDB.";
    }

    async function addCoin() {
      const product_id = document.getElementById("coinId").value;
      const item_name = document.getElementById("coinName").value || product_id;
      const target_price = document.getElementById("targetPrice").value;
      if (!product_id || !target_price) return;
      document.getElementById("status").textContent = "Saving to DynamoDB...";
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "add", product_id, item_name, target_price })
      });
      const data = await res.json();
      render(data.items || []);
      document.getElementById("status").textContent = `Added ${item_name}! Click "Run Live Price Check" to fetch its price.`;
    }

    async function runCheck() {
      document.getElementById("status").textContent = "Fetching live prices & updating S3/DynamoDB...";
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "check" })
      });
      const data = await res.json();
      render(data.items || []);
      document.getElementById("status").textContent = `Check complete! ${data.deals_count} deal(s) found and logged to S3.`;
    }

    loadItems();
  </script>
</body>
</html>
